name: scan
run-name: "scan ${{ inputs.mode || 'live' }} ${{ inputs.request_id }}"

on:
  workflow_dispatch:          # triggered by the dashboard's Scan button (or "Run workflow" on the Actions page)
    inputs:
      mode:
        description: "live = in-progress games only (default); upcoming = pre-match"
        type: choice
        options: [live, upcoming]
        default: live
      request_id:
        description: "set by the dashboard / Discord bot so it can find this run"
        type: string
        default: ""
      discord_app_id:
        description: "set by the /livebets Worker (leave empty)"
        type: string
        default: ""
      discord_token:
        description: "set by the /livebets Worker (leave empty)"
        type: string
        default: ""
      discord_count:
        description: "number of picks to post to Discord"
        type: string
        default: "5"
      discord_user:
        description: "Discord user who ran /livebets"
        type: string
        default: ""
  # schedule:                 # uncomment for automatic scans (UTC cron; GitHub may delay runs a few minutes)
  #   - cron: "*/30 * * * *"  # every 30 minutes

permissions:
  contents: write             # commit docs/data/results.json back to the repo

# No concurrency group on purpose: GitHub cancels a *pending* run when a third one queues, which would leave a
# /livebets reply stuck on "thinking". Parallel runs are safe: the commit step rebases and retries.

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Connectivity check (logs whether runner IP is blocked)
        continue-on-error: true
        run: |
          echo "Runner public IP / location:"; curl -s -m 10 https://ipinfo.io/json || true
          for u in "https://prediction-market-api.jup.ag/api/v1/events?category=sports&start=0&end=1" \
                   "https://api.jup.ag/prediction/v1/trading-status"; do
            echo "$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$u")  $u"; done
          echo "$(curl -s -o /dev/null -m 20 -w '%{http_code}' -H 'X-API-Key: CmX2KcMrXuFmNg6YFbmTxE0y9CIrOi0R' \
            https://guest.api.arcadia.pinnacle.com/0.1/sports/4/matchups)  pinnacle guest API"

      - name: Run scanner
        env:
          JUP_API_KEY: ${{ secrets.JUP_API_KEY }}   # optional; leave the secret unset if you don't have one
          SCAN_DAYS: "14"
          SCAN_MODE: ${{ inputs.mode || 'live' }}
          SCAN_REQUEST_ID: ${{ inputs.request_id }}
        run: python scanner/run_scan.py

      - name: Post top bets to Discord (/livebets)
        if: ${{ always() && inputs.discord_token != '' }}
        continue-on-error: true   # never block publishing results to the dashboard
        env:
          DISCORD_APP_ID: ${{ inputs.discord_app_id }}
          DISCORD_TOKEN: ${{ inputs.discord_token }}
          DISCORD_RELAY_KEY: ${{ secrets.DISCORD_RELAY_KEY }}
          DISCORD_COUNT: ${{ inputs.discord_count }}
          DISCORD_USER: ${{ inputs.discord_user }}
          REQUEST_ID: ${{ inputs.request_id }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/post-discord.mjs

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/results.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          echo "push failed after 3 attempts"; exit 1
